name: Build release APK (.debug suffix)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # 用 CI 现场生成的 keystore 签名。签名一致性不作要求，
      # 因此无需配置任何 repository secret。
      ANDROID_KEYFILE: ${{ github.workspace }}/ci-debug.keystore
      ANDROID_KEY_ALIAS: androiddebugkey
      ANDROID_KEY_PASSWORD: android
      ANDROID_STORE_PASSWORD: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate preinstalled Android SDK
        # 不用 android-actions/setup-android：v3 在 cmdline-tools 16.0 上
        # 默认会去装已废弃的 'tools' 包并失败；且 runner 镜像已预装
        # platforms;android-37.x 与 build-tools;37.0.0，无需再下载。
        run: |
          SDK=/usr/local/lib/android/sdk
          test -d "$SDK/platforms" || { echo "SDK not found"; exit 1; }
          echo "ANDROID_HOME=$SDK"       >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK"   >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "=== installed platforms ==="
          ls "$SDK/platforms" | grep '^android-37' || true
          echo "=== installed build-tools ==="
          ls "$SDK/build-tools" | grep '^37' || true

      - name: Generate a throwaway signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$ANDROID_KEYFILE" \
            -alias "$ANDROID_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -dname "C=US, O=Android, CN=Android Debug"

      - name: Build release APK
        run: |
          # 不加 -PreleaseOwnPackage：app/build.gradle 默认给 release 变体加
          # applicationIdSuffix '.debug'，产物包名 de.markusfisch.android.binaryeye.debug。
          chmod +x gradlew
          ./gradlew :app:assembleRelease --console=plain --no-daemon

      - name: Verify package name and signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/37* 2>/dev/null | sort -V | tail -1)
          test -n "$BT" || { echo "build-tools 37 not found"; exit 1; }
          echo "build-tools: $BT"
          "$BT/aapt" dump badging "$APK" \
            | grep -E "^package:|application-label" | head -5
          "$BT/apksigner" verify --print-certs "$APK" \
            | grep -E "certificate DN|certificate SHA-256" | head -5

      - name: Rename artifact
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          CODE=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle)
          OUT="BinaryEye-${VERSION}-${CODE}-debug-release.apk"
          cp "$APK" "$OUT"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(sha256sum "$OUT" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          ls -lh "$OUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BinaryEye-release-debug-suffix
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          echo "### 构建产物" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 文件：\`${APK_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 包名：\`de.markusfisch.android.binaryeye.debug\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256：\`${APK_SHA256}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 签名：CI 现场生成，每次构建不同（不要求签名一致）" >> "$GITHUB_STEP_SUMMARY"
